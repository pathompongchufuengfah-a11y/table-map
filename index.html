<title>ผังโต๊ะร้าน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#21140D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ผังโต๊ะ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&display=swap">
<style>
/* Theme: โคตรพร้อม, night version. Orange leads, cream is the text colour, the night brown (#21140D) becomes the ground.
   Green / yellow / red are used only for table status. Floor plan sits on a dark card like the notebook page. */
:root{
  --bg:#21140D; --card:#2B1A10; --ink:#FFF9F3; --muted:#D9BFAA; --line:#4A3020;
  --brand:#EA580C; --brand-ink:#C2410C; --brand-edge:#9A3412; --brand-soft:#FFE8D4; --brand-500:#F97316;
  --ok:#157A3A; --ok-soft:#E2F7E8; --warn:#8A5A00; --warn-soft:#FFF2CC; --bad:#B42318; --bad-soft:#FDE7E4;
  --night:#21140D; --r:26px;
  --shadow:0 2px 0 #3A2518,0 12px 24px -14px rgba(0,0,0,.7);
  --display:"Mali","Noto Sans Thai Looped",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai Looped","Sukhumvit Set","Leelawadee UI",sans-serif;font-size:19px;line-height:1.55;
  padding-block:10px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,.btn,.num{font-family:var(--display);font-weight:700}
h1,h2{margin:0}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--brand-500);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* น้องพร้อม */
.nong .m-body{fill:#fff;stroke:#21140D;stroke-width:4.5;stroke-linejoin:round}
.nong .m-speed{fill:none;stroke:#FDB27A;stroke-width:6;stroke-linecap:round}
.nong .m-cheek{fill:#FDB27A}
.nong .m-eye{fill:none;stroke:#21140D;stroke-width:7.5;stroke-linecap:round}
.nong .m-line{fill:none;stroke:#21140D;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.nong .m-drop{fill:#8FD3F4;stroke:#21140D;stroke-width:3}
.nong .m-solid{fill:#21140D;stroke:#21140D;stroke-width:4;stroke-linejoin:round}
.hd .nong .m-speed{stroke:#FFE0C2}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hd{display:flex;align-items:center;gap:8px;min-width:0}
.hd .nong{flex:none;display:block}
.hdt{min-width:0;display:flex;flex-direction:column;gap:6px}
h1{font-size:21px;line-height:1.1}
.say{position:relative;background:#fff;color:var(--night);border:2.5px solid var(--night);border-radius:18px;padding:1px 12px;font-size:14px;font-weight:600;line-height:1.4;width:fit-content;max-width:100%;box-shadow:0 0 0 2px var(--line)}
.sync{font-size:12px;color:var(--muted)} .sync[hidden]{display:none} .sync.off{color:#FDB27A}
.seg{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:40px;padding:0 18px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:17px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-edge);transform:translateY(-1px)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:6px 10px 5px;min-width:0;box-shadow:var(--shadow)}
.tile .k{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:3px solid}
.dot.free{background:var(--ok);border-color:#0E4F25} .dot.busy{background:var(--bad);border-color:#6E130C}
.dot.resv{background:#F2B705;border-color:var(--warn)} .dot.all{background:var(--card);border-color:var(--muted)}
.tile .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .u{font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}

.tabs[hidden]{display:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.tab{flex:none;min-height:56px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 22px;text-align:left;min-width:120px}
.tab .tn{display:block;font-family:var(--display);font-weight:700;line-height:1.2}
.tab .tc{display:block;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.25}
.tab[aria-selected="true"]{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-edge)}
.tab[aria-selected="true"] .tc{color:var(--brand-soft)}

.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.board{min-width:0}
.sizer{position:relative;margin:0 auto;border:2px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;box-sizing:content-box;box-shadow:var(--shadow)}
.stage{position:absolute;left:0;top:0;width:380px;height:720px;transform-origin:0 0;}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.panel h2{font-size:17px;color:var(--brand-500);margin-bottom:8px}
.panel section+section{border-top:2px solid var(--line);padding-top:16px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:72px;padding:8px 4px;border:2px solid var(--line);background:var(--bg);border-radius:18px;font-size:15px;font-weight:500}
.tool:hover{border-color:var(--brand)}
.tool:active{transform:translateY(2px)}
.tool svg{width:26px;height:26px;fill:none;stroke:var(--brand-500);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tool b{height:26px;line-height:26px;font-size:16px;color:var(--brand-500)}
label{display:block;font-size:15px;color:var(--muted);margin-bottom:4px}
input[type=text]{width:100%;min-height:48px;padding:8px 14px;border:2px solid var(--line);border-radius:16px;background:var(--bg)}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.row span{flex:1;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:48px;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:0 16px;font-size:17px}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:translateY(2px)}
.btn.sq{width:52px;padding:0;font-size:24px;line-height:1}
.btn.warn{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hint{margin:0;color:var(--muted);font-size:16px}
.legend{display:flex;flex-direction:column;gap:10px;font-size:18px}
.legend div{display:flex;align-items:center;gap:10px}

[data-mode="use"] #editSide{display:none}
[data-mode="edit"] #useSide{display:none}

/* ---- items on the floor plan ---- */
.it{position:absolute;user-select:none;-webkit-user-select:none}
.tbl{border:0;border-radius:14px;color:#fff;--edge:#000;box-shadow:0 5px 0 var(--edge);margin-bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:background-color .1s}
.tbl.s-free{background:var(--ok);--edge:#0E4F25}
.tbl.s-busy{background:var(--bad);--edge:#6E130C}
.tbl.s-resv{background:#F2B705;--edge:var(--warn);color:var(--night)}
.tbl .num{font-size:21px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;font-variant-numeric:tabular-nums}
.tbl .num.sm{font-size:14px}
.tbl .st{font-size:11px;font-weight:700;white-space:nowrap;opacity:.9}
.tbl.tiny .st{display:none}
[data-mode="use"] .tbl{cursor:pointer}
[data-mode="use"] .tbl:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.chair{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.chair::after{content:'';position:absolute;inset:-7px}
[data-mode="edit"] .it{cursor:grab;touch-action:none}
[data-mode="edit"] .chair{cursor:move}

.zone{border:2px solid var(--muted);border-radius:12px;background:rgba(255,249,243,.05);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;font-weight:600;text-align:center}
.zone .lbl{background:var(--card);padding:0 6px;border-radius:8px;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone .lbl:empty{display:none}
.zone.vert .lbl{writing-mode:vertical-rl;padding:6px 0;max-height:94%}
.stairs{background-image:repeating-linear-gradient(0deg,transparent 0 9px,var(--line) 9px 11px)}
.stage-z{border-color:var(--brand);color:var(--brand-500);background-image:repeating-linear-gradient(45deg,transparent 0 7px,rgba(249,115,22,.18) 7px 9px)}
.counter{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--line) 4px 6px)}
.box{background:transparent;border-style:dashed}
.door{color:var(--brand-500)}
.door svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.cap{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:1px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink)}
.cap:empty{display:none}
.textit{font-size:15px;font-weight:600;white-space:nowrap;padding:2px 5px;color:var(--ink)}
[data-mode="edit"] .textit:empty::before{content:"ข้อความ";color:var(--muted);font-weight:400}
.it.sel{outline:3px dashed var(--brand-500);outline-offset:3px;z-index:5}
.rz{position:absolute;right:-9px;bottom:-9px;width:20px;height:20px;background:var(--brand);border:3px solid var(--ink);border-radius:8px;cursor:nwse-resize;display:none}
[data-mode="edit"] .it.sel .rz{display:block}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#fff;color:var(--night);border:2.5px solid var(--night);border-radius:20px;padding:8px 20px;font-weight:700;font-size:17px;max-width:calc(100% - 32px);text-align:center;
  box-shadow:0 0 0 2px var(--line),0 12px 24px -10px rgba(0,0,0,.8);transition:opacity .15s,transform .15s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr)}
  #editSide{order:-1}
}
@media (max-width:420px){
  h1{font-size:20px}
  .tile{padding:5px 8px 4px} .tile .n{font-size:24px} .tile .k{font-size:12px} .tile .u{display:none}
  .seg button{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){.tbl,.toast{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="hd">
      <span id="nong"></span>
      <div class="hdt">
        <h1>ผังโต๊ะร้าน</h1>
        <div class="say" id="say"></div>
        <div class="sync" id="sync" hidden></div>
      </div>
    </div>
    <div class="seg" role="group" aria-label="โหมด">
      <button id="mUse" aria-pressed="true">ใช้งาน</button>
      <button id="mEdit" aria-pressed="false">จัดผัง</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-live="polite"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="ชั้น"></nav>

  <main class="work">
    <div class="board" id="board">
      <div class="sizer" id="sizer"><div class="stage" id="stage"></div></div>
    </div>

    <div class="side">
      <aside class="panel" id="useSide">
        <section>
          <h2>วิธีใช้</h2>
          <p class="hint">แตะโต๊ะเพื่อเปลี่ยนสถานะ ว่าง → มีลูกค้า → จอง → ว่าง</p>
        </section>
        <section>
          <h2>สี</h2>
          <div class="legend">
            <div><span class="dot free"></span>ว่าง</div>
            <div><span class="dot resv"></span>จอง</div>
            <div><span class="dot busy"></span>มีลูกค้านั่งอยู่</div>
          </div>
        </section>
        <section>
          <button class="btn" id="clearAll">ล้างทุกโต๊ะให้ว่าง</button>
        </section>
      </aside>

      <aside class="panel" id="editSide">
        <section>
          <h2>เพิ่มลงในผัง (ชั้นนี้)</h2>
          <div class="tools" id="tools"></div>
        </section>
        <section>
          <h2>ที่เลือกอยู่</h2>
          <div id="insp"></div>
        </section>
        <section>
          <h2>ชั้นนี้</h2>
          <label for="flName">ชื่อชั้น</label>
          <input type="text" id="flName" maxlength="20">
          <div class="btns">
            <button class="btn" id="addFloor">เพิ่มชั้น</button>
            <button class="btn" id="delFloor">ลบชั้นนี้</button>
            <button class="btn" id="resetAll">คืนผังตั้งต้น</button>
          </div>
        </section>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function(){
'use strict';
var W=380,H=720,KEY='tablemap.v4';
var CYCLE={free:'busy',busy:'resv',resv:'free'};
var SLABEL={free:'ว่าง',busy:'มีลูกค้า',resv:'จอง'};
var TOAST={free:'โต๊ะว่างแล้ว พร้อมรับลูกค้าน้า~',busy:'ลูกค้านั่งแล้วน้า~ น้องพร้อมจดให้แล้ว',resv:'จดว่าจองให้แล้วน้า~'};
var ICON={
  t1:'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>',
  t2:'<svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="2.5"/></svg>',
  door:'<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V4a16 16 0 0 1 14 17"/></svg>',
  stairs:'<svg viewBox="0 0 24 24"><path d="M3 21h5v-5h5v-5h5V6h3"/></svg>',
  wc:'<b>WC</b>',
  stage:'<svg viewBox="0 0 24 24"><path d="M3 18l3-10h12l3 10z"/></svg>',
  counter:'<svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6"/><path d="M5 15v4M19 15v4"/></svg>',
  box:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" stroke-dasharray="3 2.5"/></svg>',
  text:'<b>Aa</b>'
};
var TYPES={
  t1:{name:'โต๊ะเล็ก',table:true,w:56,h:56},
  t2:{name:'โต๊ะใหญ่',table:true,w:112,h:56},
  door:{name:'ประตู',w:44,h:44,label:'ทางเข้า'},
  stairs:{name:'บันได',w:110,h:70,zone:true,label:'บันได'},
  wc:{name:'ห้องน้ำ',w:70,h:100,zone:true,label:'ห้องน้ำ'},
  stage:{name:'เวที',w:90,h:130,zone:true,label:'เวที'},
  counter:{name:'เคาน์เตอร์',w:130,h:30,zone:true,label:'เคาน์เตอร์'},
  box:{name:'พื้นที่',w:100,h:80,zone:true,label:'พื้นที่'},
  text:{name:'ข้อความ',w:0,h:0,label:'ข้อความ'}
};

/* น้องพร้อม: shape and colours as in the spec, only the mood changes */
function nongSvg(mood, size) {
  var M = {
    happy:  ['M70 40v7', 'M94 40v7', 'm-eye', 'M76 56q6 7 12 0', 'm-line'],
    wink:   ['M70 40v7', 'M89 45q5-6 10 0', 'm-eye', 'M75 55q7 10 14 0z', 'm-solid'],
    search: ['M75 38v7', 'M99 38v7', 'm-eye', 'M84 58a3 3 0 1 0 0.1 0', 'm-line'],
    sad:    ['M70 42v6', 'M94 42v6', 'm-eye', 'M75 61q7-7 14 0', 'm-line'],
    sweat:  ['M70 41v6', 'M94 41v6', 'm-eye', 'M75 59q3.5-4 7 0t7 0', 'm-line', '<path class="m-drop" d="M125 12Q133 25 125 31Q117 25 125 12Z"/>'],
    sleepy: ['M64 45q6 4 12 0', 'M88 45q6 4 12 0', 'm-line', 'M79 58q3 2.5 6 0', 'm-line', '<path class="m-line" d="M116 6h9l-9 10h9"/>'],
    party:  ['M64 46q6-7 12 0', 'M88 46q6-7 12 0', 'm-line', 'M74 54q8 12 16 0z', 'm-solid'],
    offline:['M66 40l8 8m0-8l-8 8', 'M90 40l8 8m0-8l-8 8', 'm-line', 'M77 58h10', 'm-line']
  };
  var m = M[mood] || M.happy, w = size || 96;
  return '<svg class="nong" viewBox="0 0 140 110" width="'+w+'" height="'+Math.round(w * 110 / 140)+'" aria-hidden="true">'+
    '<path class="m-speed" d="M6 34h18M2 48h20M10 62h12"/>'+
    '<path class="m-body" d="M62 10H102A28 28 0 0 1 130 38V54A28 28 0 0 1 102 82H68L46 101L50 79Q34 72 34 54V38A28 28 0 0 1 62 10Z"/>'+
    '<ellipse class="m-cheek" cx="58" cy="58" rx="6.5" ry="4"/><ellipse class="m-cheek" cx="106" cy="58" rx="6.5" ry="4"/>'+
    '<path class="'+m[2]+'" d="'+m[0]+'"/><path class="'+m[2]+'" d="'+m[1]+'"/><path class="'+m[4]+'" d="'+m[3]+'"/>'+(m[5] || '')+'</svg>';
}

var SYNC_URL='https://script.google.com/macros/s/AKfycbyE8OqfLFVR0mOM6Q3TOhtxjPnDwxRXKlF47FDRmcejET7OVzTTMD0Om_EXAq8OyyI2/exec', SYNC_KEY='';   /* ใส่ลิงก์ Apps Script (และรหัส) ที่นี่ ดู INSTALL.md */
var syncOn=!!SYNC_URL, pending=0, lastLayout='', saveT=0;
var state, mode='use', sel=null, scale=1, armed=null, armT=0, drag=null, seq=0, toastT=0;
var $=function(id){return document.getElementById(id);};
var stage=$('stage'), sizer=$('sizer'), board=$('board');

function uid(){return 'i'+(Date.now().toString(36))+(++seq)+Math.random().toString(36).slice(2,5);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function snap(v,g){return Math.round(v/g)*g;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* ---------- chairs ---------- */
function slots(it){
  var off=9,out=[];
  function per(len){return len<=60?1:Math.round(len/28);}
  function order(n){var a=[],k;for(k=0;k<n;k++)a.push(k);a.sort(function(p,q){return Math.abs(p-(n-1)/2)-Math.abs(q-(n-1)/2);});return a;}
  var nW=per(it.w),nH=per(it.h),oW=order(nW),oH=order(nH),i;
  var max=Math.max(nW,nH);
  for(i=0;i<max;i++){
    if(i<nW){out.push({x:it.w*(oW[i]+.5)/nW,y:-off});out.push({x:it.w*(oW[i]+.5)/nW,y:it.h+off});}
    if(i<nH){out.push({x:-off,y:it.h*(oH[i]+.5)/nH});out.push({x:it.w+off,y:it.h*(oH[i]+.5)/nH});}
  }
  return out;
}
function addChair(it){
  var all=slots(it),pick=null,i;
  for(i=0;i<all.length;i++){
    var s=all[i];
    if(!it.chairs.some(function(c){return Math.hypot(c.cx-s.x,c.cy-s.y)<7;})){pick=s;break;}
  }
  if(!pick)return false;
  it.chairs.push({cx:pick.x,cy:pick.y});return true;
}

/* ---------- default layout: copied from the paper plan ---------- */
function defaults(){
  function mk(type,x,y,label,o){
    var d=TYPES[type];o=o||{};
    var it={id:uid(),type:type,x:x,y:y,w:o.w||d.w,h:o.h||d.h,label:label,chairs:[]};
    if(d.table)it.status='free';
    return it;
  }
  function ch(it,s,f){
    var p={t:[it.w*f,-9],b:[it.w*f,it.h+9],l:[-9,it.h*f],r:[it.w+9,it.h*f]}[s];
    it.chairs.push({cx:p[0],cy:p[1]});
  }
  function tb(type,x,y,label,sides,o){
    var it=mk(type,x,y,label,o);

  }
  var L4=['t:.25','t:.75','b:.25','b:.75'];
  var f1=[
    mk('stairs',8,8,'ทางไปชั้นสอง',{w:108,h:140}),
    tb('t2',128,30,'14',L4),
    tb('t2',128,112,'13',['b:.25','b:.75']),
    mk('door',333,4,'ทางเข้า',{w:38,h:38}),
    mk('box',300,66,'บาร์น้ำ',{w:75,h:78}),
    mk('counter',300,150,'',{w:75,h:12}),
    tb('t1',262,46,'B1',[],{w:34,h:34}),
    tb('t1',262,88,'B2',[],{w:34,h:34}),
    tb('t1',262,130,'B3',[],{w:34,h:34}),
    tb('t1',30,190,'9',['l','r','t','b']),
    tb('t1',150,190,'8',['l','r','t']),
    tb('t1',150,262,'7',['l','r']),
    tb('t1',150,334,'6',['l','r']),
    tb('t1',150,406,'5',['l','r']),
    tb('t1',150,478,'4',['l','r','b']),
    tb('t2',6,272,'10',L4),
    tb('t2',6,366,'11',L4),
    tb('t2',6,460,'12',L4),
    mk('stage',235,190,'เวที',{w:140,h:150}),
    tb('t1',300,395,'3',['t','l','b']),
    tb('t2',264,470,'2',L4),
    tb('t2',264,570,'1',L4),
    mk('counter',172,565,'',{w:10,h:95}),
    mk('door',150,640,'ห้องน้ำ'),
    mk('box',8,548,'',{w:138,h:144}),
    mk('text',14,551,'ชั้นสอง'),
    tb('t1',24,592,'16',['t','l'],{w:38,h:38}),
    tb('t1',70,592,'15',['t'],{w:38,h:38}),
    tb('t1',28,646,'17',['l','r','b'],{w:38,h:38}),
    mk('stairs',116,578,'บันได',{w:26,h:100})
  ];
  return {cur:'f1',floors:[{id:'f1',name:'ผังร้าน',items:f1}]};
}

function load(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.floors)&&s.floors.length)return s;
  }catch(e){}
  return defaults();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(syncOn&&mode==='edit'){
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      lastLayout=JSON.stringify(state.floors);
      api({action:'layout',layout:{cur:state.cur,floors:state.floors}}).then(function(){setSync(true);}).catch(function(){setSync(false);});
    },700);
  }
}
/* ---------- sync (optional): Google Apps Script + Sheet ---------- */
function setSync(ok){
  var el=$('sync');
  if(!syncOn){el.hidden=true;return;}
  el.hidden=false;el.className='sync '+(ok?'on':'off');
  el.textContent=ok?'● ใช้ร่วมกันทุกเครื่อง':'● เน็ตหลุด จะลองใหม่เอง';
}
function api(body){
  body.key=SYNC_KEY;
  return fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json();});
}
function pull(){return fetch(SYNC_URL+(SYNC_URL.indexOf('?')<0?'?':'&')+'t='+Date.now()).then(function(r){return r.json();});}
function track(p){
  pending++;
  p.then(function(){setSync(true);}).catch(function(){setSync(false);}).then(function(){pending--;});
}
function applyRemote(d){
  var changed=false;
  if(mode==='use'&&d.layout&&Array.isArray(d.layout.floors)){
    var s=JSON.stringify(d.layout.floors);
    if(s!==lastLayout){
      lastLayout=s;var cur=state.cur;state.floors=d.layout.floors;
      state.cur=state.floors.some(function(f){return f.id===cur;})?cur:state.floors[0].id;changed=true;
    }
  }
  var st=d.status||{};
  allTables().forEach(function(t){var v=st[t.id];if(v&&v!==t.status){t.status=v;changed=true;}});
  if(changed){save();renderAll();}
}
function poll(){
  if(!syncOn||document.hidden||pending>0||drag)return;
  pull().then(function(d){setSync(true);applyRemote(d);}).catch(function(){setSync(false);});
}
function startSync(){
  if(!syncOn){setSync(true);return;}
  pull().then(function(d){
    setSync(true);
    if(!d.layout){lastLayout=JSON.stringify(state.floors);track(api({action:'layout',layout:{cur:state.cur,floors:state.floors}}));}
    else applyRemote(d);
  }).catch(function(){setSync(false);});
  setInterval(poll,5000);
  document.addEventListener('visibilitychange',poll);
}

function curFloor(){return state.floors.filter(function(f){return f.id===state.cur;})[0]||state.floors[0];}
function byId(id){return curFloor().items.filter(function(i){return i.id===id;})[0];}
function isTable(it){return !!TYPES[it.type].table;}
function allTables(floor){
  var fl=floor?[floor]:state.floors,out=[];
  fl.forEach(function(f){f.items.forEach(function(i){if(isTable(i))out.push(i);});});
  return out;
}
function nextNum(){
  var m=0;allTables().forEach(function(t){var n=parseInt(t.label,10);if(n>m)m=n;});
  return String(m+1);
}
function counts(){
  var c={free:0,busy:0,resv:0,all:0};
  allTables().forEach(function(t){c[t.status]++;c.all++;});
  return c;
}

/* ---------- rendering ---------- */
function buildItem(it){
  var d=TYPES[it.type],el=document.createElement('div');
  el.dataset.id=it.id;
  el.style.left=it.x+'px';el.style.top=it.y+'px';
  var cls='it '+it.type;
  if(it.id===sel&&mode==='edit')cls+=' sel';
  if(d.table){
    var tiny=it.w<40;
    cls+=' tbl s-'+it.status+(tiny?' tiny':'');
    el.style.width=it.w+'px';el.style.height=it.h+'px';
    var n=document.createElement('span');n.className='num'+((tiny||String(it.label).length>3)?' sm':'');n.textContent=it.label;
    var s=document.createElement('span');s.className='st';s.textContent=SLABEL[it.status];
    el.appendChild(n);el.appendChild(s);
    it.chairs.forEach(function(c,i){
      var ce=document.createElement('div');ce.className='chair';ce.dataset.ci=i;
      ce.style.left=(c.cx-5)+'px';ce.style.top=(c.cy-5)+'px';el.appendChild(ce);
    });
    if(mode==='use'){
      el.tabIndex=0;el.setAttribute('role','button');
      el.setAttribute('aria-label','โต๊ะ '+it.label+' '+SLABEL[it.status]);
    }
  }else if(it.type==='door'){
    cls+=' door';el.style.width=it.w+'px';el.style.height=it.h+'px';
    el.innerHTML='<svg viewBox="0 0 44 44"><path d="M2 40h40M7 40V6a34 34 0 0 1 30 34"/></svg>';
    var cap=document.createElement('span');cap.className='cap';cap.textContent=it.label;el.appendChild(cap);
  }else if(it.type==='text'){
    cls+=' textit';el.textContent=it.label;
  }else{
    cls+=' zone '+(it.type==='stage'?'stage-z':it.type)+((it.w<40&&it.h>it.w*2)?' vert':'');
    el.style.width=it.w+'px';el.style.height=it.h+'px';
    var l=document.createElement('span');l.className='lbl';l.textContent=it.label;el.appendChild(l);
  }
  if(d.zone||it.type==='door'){
    var rz=document.createElement('div');rz.className='rz';el.appendChild(rz);
  }
  el.className=cls;
  return el;
}
function renderStage(){
  stage.innerHTML='';
  curFloor().items.forEach(function(it){stage.appendChild(buildItem(it));});
}
function renderHeader(){
  var c=counts(),m='happy',t;
  if(mode==='edit'){t='จัดผังได้เลยน้า ลากโต๊ะไปวางได้~';}
  else if(c.all&&c.free===0){m='party';t='เต็มร้านแล้ว เก่งมาก!';}
  else if(c.busy+c.resv===0){m='sleepy';t='ร้านยังเงียบ รอลูกค้าน้า~';}
  else{m='wink';t='ว่างอยู่ '+c.free+' โต๊ะน้า~';}
  $('nong').innerHTML=nongSvg(m,56);
  $('say').textContent=t;
}
function renderStats(){
  var c=counts();
  function tile(cls,label,n){
    return '<div class="tile"><div class="k"><span class="dot '+cls+'"></span>'+label+'</div><div class="n">'+n+'<span class="u">โต๊ะ</span></div></div>';
  }
  $('stats').innerHTML=tile('free','ว่าง',c.free)+tile('resv','จอง',c.resv)+tile('busy','มีลูกค้า',c.busy)+tile('all','ทั้งหมด',c.all);
  renderHeader();fit();
}
function renderTabs(){
  $('tabs').innerHTML=state.floors.map(function(f){
    var t=allTables(f),free=t.filter(function(x){return x.status==='free';}).length;
    return '<button class="tab" role="tab" data-fl="'+f.id+'" aria-selected="'+(f.id===state.cur)+'"><span class="tn">'+esc(f.name)+'</span><span class="tc">ว่าง '+free+'/'+t.length+'</span></button>';
  }).join('');
  $('flName').value=curFloor().name;
  $('tabs').hidden=state.floors.length<2;
}
function fit(){
  var s=(board.clientWidth-4)/W;
  if(mode==='use'){
    var top=board.getBoundingClientRect().top+window.pageYOffset;
    s=Math.min(s,(window.innerHeight-top-16)/(H+4));
  }
  scale=clamp(s,.45,1.35);
  sizer.style.width=(W*scale)+'px';sizer.style.height=(H*scale)+'px';
  stage.style.transform='scale('+scale+')';
}
function renderAll(){renderStats();renderTabs();renderStage();fit();}
function toast(t){
  var el=$('toast');el.textContent=t;el.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on');},1800);
}

/* ---------- inspector (edit mode) ---------- */
function renderInspector(){
  var box=$('insp'),it=sel&&byId(sel);
  if(!it){box.innerHTML='<p class="hint">แตะโต๊ะหรือสัญลักษณ์ในผังเพื่อแก้ไข ลากเพื่อย้าย</p>';return;}
  var d=TYPES[it.type];
  var h='<label for="lbl">'+(d.table?'เลขโต๊ะ / ชื่อโต๊ะ':'ข้อความกำกับ')+'</label><input type="text" id="lbl" maxlength="24" value="'+esc(it.label)+'">';
  if(d.table){
    h+='<div class="row"><span>เก้าอี้ '+it.chairs.length+' ตัว</span><button class="btn sq" data-act="chairDec" aria-label="ลดเก้าอี้">−</button><button class="btn sq" data-act="chairInc" aria-label="เพิ่มเก้าอี้">+</button></div>';
  }
  h+='<div class="btns">';
  if(it.type!=='text')h+='<button class="btn" data-act="rotate">หมุน 90°</button>';
  h+='<button class="btn" data-act="dup">ทำสำเนา</button><button class="btn" data-act="del">ลบ</button></div>';
  if(d.zone||it.type==='door')h+='<p class="hint" style="margin-top:12px">ลากจุดส้มที่มุมเพื่อปรับขนาด</p>';
  box.innerHTML=h;
}
function select(id){
  sel=id;
  stage.querySelectorAll('.it').forEach(function(el){el.classList.toggle('sel',mode==='edit'&&el.dataset.id===id);});
  renderInspector();
}

/* ---------- actions ---------- */
function setStatus(it){
  it.status=CYCLE[it.status]||'free';
  save();renderStage();renderStats();renderTabs();toast(TOAST[it.status]);
  if(syncOn)track(api({action:'status',id:it.id,status:it.status}));
}
function addItem(type){
  var d=TYPES[type],fl=curFloor(),k=(fl.items.length%6)*14;
  var it={id:uid(),type:type,x:snap(110+k,5),y:snap(300+k,5),w:d.w,h:d.h,label:d.label||'',chairs:[]};
  if(d.table){it.status='free';it.label=nextNum();}
  fl.items.push(it);save();renderStage();renderStats();renderTabs();select(it.id);
}
function rotate(it){
  var ow=it.w,oh=it.h;
  it.chairs=it.chairs.map(function(c){return {cx:oh/2-(c.cy-oh/2),cy:ow/2+(c.cx-ow/2)};});
  it.w=oh;it.h=ow;
  it.x=clamp(it.x,0,Math.max(0,W-it.w));it.y=clamp(it.y,0,Math.max(0,H-it.h));
}
function confirmTwice(key,btn,run){
  if(armed===key){armed=null;clearTimeout(armT);run();return;}
  armed=key;var old=btn.textContent;btn.textContent='กดอีกครั้งเพื่อยืนยัน';btn.classList.add('warn');
  clearTimeout(armT);
  armT=setTimeout(function(){armed=null;btn.textContent=old;btn.classList.remove('warn');},3000);
}
function setMode(m){
  mode=m;document.body.dataset.mode=m;
  $('mUse').setAttribute('aria-pressed',m==='use');$('mEdit').setAttribute('aria-pressed',m==='edit');
  sel=null;renderStage();renderInspector();renderHeader();fit();
}

/* ---------- events ---------- */
$('mUse').onclick=function(){setMode('use');};
$('mEdit').onclick=function(){setMode('edit');};

$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab');if(!b)return;
  state.cur=b.dataset.fl;save();sel=null;renderAll();renderInspector();
});

stage.addEventListener('click',function(e){
  if(mode!=='use')return;
  var el=e.target.closest('.tbl');if(!el)return;
  var it=byId(el.dataset.id);if(it)setStatus(it);
});
stage.addEventListener('keydown',function(e){
  if(mode!=='use'||(e.key!=='Enter'&&e.key!==' '))return;
  var el=e.target.closest&&e.target.closest('.tbl');if(!el)return;
  e.preventDefault();
  var id=el.dataset.id,it=byId(id);if(!it)return;
  setStatus(it);
  var again=stage.querySelector('.tbl[data-id="'+id+'"]');if(again)again.focus();
});

stage.addEventListener('pointerdown',function(e){
  if(mode!=='edit')return;
  var el=e.target.closest('.it');
  if(!el){select(null);return;}
  var it=byId(el.dataset.id);if(!it)return;
  var kind=e.target.classList.contains('rz')?'rz':e.target.classList.contains('chair')?'chair':'item';
  if(sel!==it.id)select(it.id);
  drag={kind:kind,it:it,el:el,sx:e.clientX,sy:e.clientY,ox:it.x,oy:it.y,ow:it.w,oh:it.h,moved:false};
  if(kind==='chair'){drag.ci=+e.target.dataset.ci;drag.c0={cx:it.chairs[drag.ci].cx,cy:it.chairs[drag.ci].cy};drag.ce=e.target;}
  try{stage.setPointerCapture(e.pointerId);}catch(err){}
  e.preventDefault();
});
stage.addEventListener('pointermove',function(e){
  if(!drag)return;
  var dx=(e.clientX-drag.sx)/scale,dy=(e.clientY-drag.sy)/scale,it=drag.it,el=drag.el;
  if(Math.abs(dx)+Math.abs(dy)>1)drag.moved=true;
  if(drag.kind==='item'){
    var w=it.w||el.offsetWidth,h=it.h||el.offsetHeight;
    it.x=clamp(snap(drag.ox+dx,5),0,Math.max(0,W-w));
    it.y=clamp(snap(drag.oy+dy,5),0,Math.max(0,H-h));
    el.style.left=it.x+'px';el.style.top=it.y+'px';
  }else if(drag.kind==='rz'){
    it.w=clamp(snap(drag.ow+dx,10),10,W-it.x);
    it.h=clamp(snap(drag.oh+dy,10),10,H-it.y);
    el.style.width=it.w+'px';el.style.height=it.h+'px';
  }else{
    var c=it.chairs[drag.ci];
    c.cx=snap(drag.c0.cx+dx,2);c.cy=snap(drag.c0.cy+dy,2);
    drag.ce.style.left=(c.cx-5)+'px';drag.ce.style.top=(c.cy-5)+'px';
  }
});
function endDrag(){if(drag){var m=drag.moved;drag=null;if(m)save();}}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);

$('tools').innerHTML=Object.keys(TYPES).map(function(k){
  return '<button class="tool" data-add="'+k+'">'+ICON[k]+'<span>'+TYPES[k].name+'</span></button>';
}).join('');
$('tools').addEventListener('click',function(e){
  var b=e.target.closest('[data-add]');if(b)addItem(b.dataset.add);
});

$('insp').addEventListener('input',function(e){
  if(e.target.id!=='lbl'||!sel)return;
  var it=byId(sel);if(!it)return;
  it.label=e.target.value;save();renderStage();
});
$('insp').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||!sel)return;
  var it=byId(sel);if(!it)return;
  var act=b.dataset.act,fl=curFloor();
  if(act==='chairInc'){addChair(it);}
  else if(act==='chairDec'){it.chairs.pop();}
  else if(act==='rotate'){rotate(it);}
  else if(act==='dup'){
    var cp=JSON.parse(JSON.stringify(it));cp.id=uid();
    cp.x=clamp(it.x+20,0,Math.max(0,W-it.w));cp.y=clamp(it.y+20,0,Math.max(0,H-it.h));
    if(isTable(cp)){cp.label=nextNum();cp.status='free';}
    fl.items.push(cp);save();renderStage();renderStats();renderTabs();select(cp.id);return;
  }
  else if(act==='del'){
    confirmTwice('del',b,function(){
      fl.items=fl.items.filter(function(i){return i.id!==it.id;});
      save();sel=null;renderStage();renderStats();renderTabs();renderInspector();
    });
    return;
  }
  save();renderStage();renderInspector();
});

$('flName').addEventListener('input',function(e){
  curFloor().name=e.target.value||'ชั้น';save();
  var f=curFloor();
  var t=document.querySelector('.tab[data-fl="'+f.id+'"] .tn');if(t)t.textContent=f.name;
});
$('addFloor').onclick=function(){
  var n=state.floors.length+1,id='f'+uid();
  state.floors.push({id:id,name:'ชั้น '+n,items:[]});state.cur=id;
  save();sel=null;renderAll();renderInspector();
};
$('delFloor').onclick=function(){
  var b=this;
  if(state.floors.length<2){b.textContent='ต้องมีอย่างน้อย 1 ชั้นน้า';setTimeout(function(){b.textContent='ลบชั้นนี้';},2000);return;}
  confirmTwice('delFloor',b,function(){
    var id=curFloor().id;
    state.floors=state.floors.filter(function(f){return f.id!==id;});
    state.cur=state.floors[0].id;
    b.textContent='ลบชั้นนี้';b.classList.remove('warn');
    save();sel=null;renderAll();renderInspector();
  });
};
$('resetAll').onclick=function(){
  var b=this;
  confirmTwice('reset',b,function(){
    state=defaults();save();sel=null;
    b.textContent='คืนผังตั้งต้น';b.classList.remove('warn');
    renderAll();renderInspector();
  });
};
$('clearAll').onclick=function(){
  var b=this;
  confirmTwice('clear',b,function(){
    allTables().forEach(function(t){t.status='free';});
    b.textContent='ล้างทุกโต๊ะให้ว่าง';b.classList.remove('warn');
    save();renderStage();renderStats();renderTabs();toast('เคลียร์เรียบร้อย~ ว่างทุกโต๊ะแล้วน้า');
    if(syncOn)track(api({action:'clear'}));
  });
};

if(window.ResizeObserver)new ResizeObserver(fit).observe(board);
window.addEventListener('resize',fit);

state=load();
document.body.dataset.mode='use';
renderAll();renderInspector();startSync();
})();
</script>
